name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate skill frontmatter and links
        run: node scripts/validate-skills.mjs
